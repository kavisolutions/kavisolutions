# =====================================================================
# Kavi Solutions - dedicated Nginx site config
# =====================================================================
# This is an ISOLATED server block for kavisolutions.in ONLY.
# It does NOT touch or override any other site on this VPS (e.g. Agrinp).
# It is added as its OWN file so it can be enabled/disabled independently.
#
# INSTALL (on the VPS):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kavisolutions
#   sudo ln -s /etc/nginx/sites-available/kavisolutions /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: The Next.js app runs under PM2 on port 3111 (see ecosystem.config.js).
#   A dedicated port was chosen so it never collides with other apps on this
#   server (e.g. Agrinp on 3000). Change port 3111 below and in
#   ecosystem.config.js together if you need a different one.
# =====================================================================

server {
    listen 80;
    server_name kavisolutions.in www.kavisolutions.in;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kavisolutions.in www.kavisolutions.in;

    # --- SSL certificates (install with certbot) ---
    ssl_certificate     /etc/letsencrypt/live/kavisolutions.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kavisolutions.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Serve Kavi Solutions Next.js app via PM2 on port 3111 ---
    # (Dedicated port so it never collides with other apps on this VPS.)
    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Cache static assets aggressively ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3111;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        alias /var/www/kavi-solutions/public/;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }
}