name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST || '129.225.126.53' }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on server
        run: |
          ssh -o IdentitiesOnly=yes "${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST || '129.225.126.53' }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/kavi-solutions

          # Preserve untracked runtime config (.env files) while syncing sources.
          git fetch --prune origin main
          git clean -fd -e .env -e .env.local -e .env.production -e api/.env -e app/.env -e app/.env.local -e app/.env.production -e survey/.env -e survey/.env.local -e survey/.env.production -e social-agent/.env -e social-agent/data
          mkdir -p app
          if [ -f .env.production ] && [ ! -f app/.env.production ]; then cp .env.production app/.env.production; fi
          git reset --hard origin/main
          export SURVEY_REPO_TOKEN='${{ secrets.SURVEY_REPO_TOKEN }}'
          askpass="$(mktemp)"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) echo "x-access-token" ;;
            *) printf '%s\n' "$SURVEY_REPO_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          git submodule sync --recursive
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git submodule update --init --recursive
          rm -f "$askpass"
          rm -rf .next/types .next/dev

          bash deploy/deploy.sh --no-pull
          REMOTE
