name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST || '129.225.126.53' }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on server
        run: |
          ssh -o IdentitiesOnly=yes "${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST || '129.225.126.53' }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/kavi-solutions

          # The survey repository is public. Normalise its URLs BEFORE any git
          # command that may recurse into submodules: a stale token URL left by
          # a previous failed run makes git prompt for credentials and aborts
          # the whole deploy.
          SURVEY_REPO_URL="https://github.com/kavi-solutions/kavi-survey-research"
          git config submodule.survey.url "${SURVEY_REPO_URL}"
          if [ -e survey/.git ]; then
            git -C survey remote set-url origin "${SURVEY_REPO_URL}"
          fi
          export GIT_TERMINAL_PROMPT=0

          if ! git ls-remote "${SURVEY_REPO_URL}" HEAD >/dev/null; then
            echo "ERROR: cannot access the survey repository"
            exit 1
          fi

          # Preserve untracked runtime config (.env files) while syncing sources.
          git -c fetch.recurseSubmodules=no fetch --prune origin main
          git clean -fd -e .env -e .env.local -e .env.production -e api/.env -e app/.env -e app/.env.local -e app/.env.production -e survey/.env -e survey/.env.local -e survey/.env.production -e social-agent/.env -e social-agent/data
          mkdir -p app
          if [ -f .env.production ] && [ ! -f app/.env.production ]; then cp .env.production app/.env.production; fi

          git reset --hard origin/main
          SURVEY_TARGET="$(git ls-tree HEAD survey | awk '{print $3}')"
          if [ -e survey/.git ]; then
            git -C survey fetch --no-tags origin main
            git -C survey checkout --detach "${SURVEY_TARGET}"
          else
            git submodule update --init --recursive
          fi
          rm -rf .next/types .next/dev

          bash deploy/deploy.sh --no-pull
          REMOTE
