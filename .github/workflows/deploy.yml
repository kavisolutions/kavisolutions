name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST || '129.225.126.53' }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on server
        run: |
          ssh -o IdentitiesOnly=yes "${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST || '129.225.126.53' }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/kavi-solutions

          # Preserve untracked runtime config (.env files) while syncing sources.
          git fetch --prune origin main
          git clean -fd -e .env -e .env.local -e .env.production -e api/.env -e app/.env -e app/.env.local -e app/.env.production -e survey/.env -e survey/.env.local -e survey/.env.production -e social-agent/.env -e social-agent/data
          mkdir -p app
          if [ -f .env.production ] && [ ! -f app/.env.production ]; then cp .env.production app/.env.production; fi
          export SURVEY_REPO_TOKEN='${{ secrets.SURVEY_REPO_TOKEN }}'
          SURVEY_REPO_URL="https://github.com/kavi-solutions/kavi-survey-research"
          SURVEY_AUTH_URL="https://x-access-token:${SURVEY_REPO_TOKEN}@github.com/kavi-solutions/kavi-survey-research.git"
          cleanup_survey_auth() {
            git config submodule.survey.url "${SURVEY_REPO_URL}" 2>/dev/null || true
            if [ -d survey/.git ]; then
              git -C survey remote set-url origin "${SURVEY_REPO_URL}" 2>/dev/null || true
            fi
          }
          trap cleanup_survey_auth EXIT
          export GIT_TERMINAL_PROMPT=0
          echo "Survey repo token length: ${#SURVEY_REPO_TOKEN}"
          if ! git ls-remote "${SURVEY_AUTH_URL}" HEAD >/dev/null; then
            echo "ERROR: cannot authenticate to the private survey repository"
            exit 1
          fi
          # The reset may recurse into an already-cloned submodule, so point
          # both URLs at the authenticated URL before touching the tree.
          if [ -d survey/.git ]; then
            git -C survey remote set-url origin "${SURVEY_AUTH_URL}"
          fi
          git config submodule.survey.url "${SURVEY_AUTH_URL}"
          git reset --hard origin/main
          SURVEY_TARGET="$(git ls-tree HEAD survey | awk '{print $3}')"
          if [ -d survey/.git ]; then
            git -C survey remote set-url origin "${SURVEY_AUTH_URL}"
            git -C survey fetch --no-tags origin main
            git -C survey checkout --detach "${SURVEY_TARGET}"
          else
            git config submodule.survey.url "${SURVEY_AUTH_URL}"
            git submodule update --init --recursive
          fi
          cleanup_survey_auth
          trap - EXIT
          unset SURVEY_REPO_TOKEN
          rm -rf .next/types .next/dev

          bash deploy/deploy.sh --no-pull
          REMOTE
