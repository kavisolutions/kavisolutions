name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          # Full known_hosts line, e.g. "129.225.126.53 ssh-ed25519 AAAA...".
          # Pin it: ssh-keyscan trusts whatever key is presented and allows MITM.
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "ERROR: DEPLOY_HOST_KEY secret is required (known_hosts line for the VPS)"
            exit 1
          fi
          echo "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -o IdentitiesOnly=yes "${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST || '129.225.126.53' }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/kavi-solutions

          # The survey repo is PRIVATE. Normalise its URLs to the current token
          # BEFORE any git command that may recurse into submodules: a stale
          # token URL left by a previous failed run makes git prompt for
          # credentials and aborts the whole deploy. Always clean it up after.
          SURVEY_REPO_URL="https://github.com/kavi-solutions/kavi-survey-research"
          export SURVEY_REPO_TOKEN='${{ secrets.SURVEY_REPO_TOKEN }}'
          if [ -z "${SURVEY_REPO_TOKEN}" ]; then
            echo "ERROR: SURVEY_REPO_TOKEN is not set"
            exit 1
          fi
          SURVEY_CLONE_URL="https://x-access-token:${SURVEY_REPO_TOKEN}@github.com/kavi-solutions/kavi-survey-research.git"
          cleanup_survey_auth() {
            git config submodule.survey.url "${SURVEY_REPO_URL}" 2>/dev/null || true
            if [ -e survey/.git ]; then
              git -C survey remote set-url origin "${SURVEY_REPO_URL}" 2>/dev/null || true
            fi
          }
          trap cleanup_survey_auth EXIT
          export GIT_TERMINAL_PROMPT=0
          git config submodule.survey.url "${SURVEY_CLONE_URL}"
          if [ -e survey/.git ]; then
            git -C survey remote set-url origin "${SURVEY_CLONE_URL}"
          fi

          if ! git ls-remote "${SURVEY_CLONE_URL}" HEAD >/dev/null; then
            echo "ERROR: cannot access the survey repository"
            exit 1
          fi

          # Preserve untracked runtime config (.env files) while syncing sources.
          git -c fetch.recurseSubmodules=no fetch --prune origin main
          git clean -fd -e .env -e .env.local -e .env.production -e api/.env -e app/.env -e app/.env.local -e app/.env.production -e survey/.env -e survey/.env.local -e survey/.env.production -e social-agent/.env -e social-agent/data
          mkdir -p app
          if [ -f .env.production ] && [ ! -f app/.env.production ]; then cp .env.production app/.env.production; fi

          git reset --hard origin/main
          SURVEY_TARGET="$(git ls-tree HEAD survey | awk '{print $3}')"
          if [ -e survey/.git ]; then
            git -C survey remote set-url origin "${SURVEY_CLONE_URL}"
            git -C survey fetch --no-tags origin main
            git -C survey checkout --detach "${SURVEY_TARGET}"
          else
            git config submodule.survey.url "${SURVEY_CLONE_URL}"
            git submodule update --init --recursive
          fi
          cleanup_survey_auth
          trap - EXIT
          # Keep the token exported: deploy.sh --no-pull still syncs submodules
          # and may need auth if the submodule checkout needs refreshing.
          rm -rf .next/types .next/dev

          bash deploy/deploy.sh --no-pull
          REMOTE
